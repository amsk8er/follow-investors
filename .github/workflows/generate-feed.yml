name: Generate Investment Feed

on:
  schedule:
    # Daily at 06:00 UTC (14:00 CST)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Feed mode'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - tweets
          - podcasts
          - newsletters
          - youtube

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm ci --ignore-scripts

      - name: Generate feeds
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
        run: node scripts/generate-feed.js ${{ github.event.inputs.mode || 'all' }}

      - name: Commit updated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed-*.json state-feed.json
          git diff --staged --quiet || git commit -m "feed: $(date -u +%Y-%m-%d)"
          git push
